{#- App switcher shown in every header.  `active` = home | survey | studio | admin. -#}
<nav class="appnav" aria-label="Apps">
  <a class="appnav-link{% if active == 'home' %} on{% endif %}" href="{{ '/workspace/' if config.WORKSPACE_ENABLED else '/' }}">Projects</a>
  <a class="appnav-link{% if active == 'survey' %} on{% endif %}" href="{{ survey_href or '/survey/' }}">Survey</a>
  <a class="appnav-link{% if active == 'studio' %} on{% endif %}" href="/studio/{% if nav_study %}#{{ nav_study }}{% endif %}">Design</a>
  <a class="appnav-link{% if active == 'admin' %} on{% endif %}" href="/admin/{% if nav_study %}?study={{ nav_study }}{% endif %}">Monitor</a>
</nav>
