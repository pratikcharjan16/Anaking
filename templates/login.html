<body class="login-page"><main class="login-card"><a class="wordmark" href="/">a<span>anaking</span></a><p class="eyebrow">YOUR RESEARCH WORKSPACE</p><h1>Welcome back.</h1><p>Sign in to design, review and understand your research.</p>{% if error %}<p role="alert" class="notice danger">{{error}}</p>{% endif %}<form method="post"><input type="hidden" name="csrf" value="{{csrf_token()}}"><label>Username<input name="username" autocomplete="username" required autofocus></label><label>Password<input name="password" type="password" autocomplete="current-password" required></label><button class="primary">Sign in →</button></form><small>Need access? Ask your workspace owner.</small></main></body></html>
