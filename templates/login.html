<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Sign in · Anaking</title><link rel="stylesheet" href="/static/css/workspace.css"></head>
<body class="login-page"><main class="login-card"><a class="anaking-brand-lockup" href="/" title="Anaking — An Intelligent Insight Platform">
  <svg class="anaking-svg-logo" viewBox="0 0 44 44" width="44" height="44" fill="none" xmlns="http://www.w3.org/2000/svg" aria-label="Anaking Logo">
    <defs>
      <linearGradient id="ak-lg-bg" x1="0" y1="0" x2="44" y2="44" gradientUnits="userSpaceOnUse">
        <stop offset="0%" stop-color="#0f172a"/>
        <stop offset="50%" stop-color="#1e293b"/>
        <stop offset="100%" stop-color="#090d16"/>
      </linearGradient>
      <linearGradient id="ak-lg-crown" x1="6" y1="8" x2="38" y2="36" gradientUnits="userSpaceOnUse">
        <stop offset="0%" stop-color="#00f5a0"/>
        <stop offset="50%" stop-color="#00d9f5"/>
        <stop offset="100%" stop-color="#7928ca"/>
      </linearGradient>
      <linearGradient id="ak-lg-facet" x1="12" y1="12" x2="32" y2="32" gradientUnits="userSpaceOnUse">
        <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/>
        <stop offset="100%" stop-color="#00d9f5" stop-opacity="0.2"/>
      </linearGradient>
      <filter id="ak-lg-glow" x="-20%" y="-20%" width="140%" height="140%">
        <feGaussianBlur stdDeviation="1.8" result="blur"/>
        <feComposite in="SourceGraphic" in2="blur" operator="over"/>
      </filter>
    </defs>
    <rect class="ak-ring" x="2" y="2" width="40" height="40" rx="12" fill="url(#ak-lg-bg)" stroke="url(#ak-lg-crown)" stroke-width="1.5"/>
    <g class="ak-crown-group" filter="url(#ak-lg-glow)">
      <path d="M 22 9 L 28 20 L 22 25 L 16 20 Z" fill="url(#ak-lg-crown)"/>
      <path d="M 10 14 L 16 20 L 12 28 L 8 21 Z" fill="url(#ak-lg-crown)" opacity="0.9"/>
      <path d="M 34 14 L 36 21 L 32 28 L 28 20 Z" fill="url(#ak-lg-crown)" opacity="0.9"/>
      <path d="M 12 28 L 22 25 L 32 28 L 22 36 Z" fill="url(#ak-lg-crown)" opacity="0.8"/>
      <polygon points="22,14 25,20 22,23 19,20" fill="url(#ak-lg-facet)"/>
    </g>
    <circle class="ak-particle" cx="22" cy="4" r="2" fill="#00f5a0"/>
  </svg>
  <div class="anaking-brand-text">
    <div class="anaking-brand-title">
      <b class="brand-anaking">Anaking</b>
      <span class="brand-sub-badge">PLATFORM<span class="live-pulse-dot"></span></span>
    </div>
    <span class="anaking-tagline"><span class="tagline-spark">✦</span> An Intelligent Insight Platform</span>
  </div>
</a><p class="eyebrow">YOUR RESEARCH WORKSPACE</p><h1>Welcome back.</h1><p>Sign in to design, review and understand your research.</p>{% if error %}<p role="alert" class="notice danger">{{error}}</p>{% endif %}<form method="post"><input type="hidden" name="csrf" value="{{csrf_token()}}"><label>Username<input name="username" autocomplete="username" required autofocus></label><label>Password<input name="password" type="password" autocomplete="current-password" required></label><button class="primary">Sign in →</button></form><small>Need access? Ask your workspace owner.</small></main></body></html>
